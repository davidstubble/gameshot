<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151719">
    <meta name="robots" content="noindex, nofollow">
    <title>GameShot Cropper — Offline</title>
    <style>
      :root { color-scheme: dark; background: #151719; color: #f3f5ef; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 32rem; border: 1px solid #303536; border-radius: 16px; padding: 28px; background: #1b1f20; }
      .mark { color: #c5f76f; font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; }
      h1 { margin: 12px 0; font-size: clamp(1.7rem, 6vw, 2.4rem); }
      p { color: #b5bcb2; line-height: 1.6; margin: 0 0 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">GAMESHOT · OFFLINE</div>
      <h1>Reconnect to continue.</h1>
      <p>Account access, purchase history, Checkout, and Pro verification require an internet connection.</p>
      <p>This offline page does not restore user images or paid access. Reconnect, then return to GameShot.</p>
    </main>
  </body>
</html>
